<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="upd" id="upd" hidden role="status"><button id="updGo"><b id="updTxt"></b><span id="updSub">Tap to refresh</span></button><a id="updNew" target="_blank" rel="noopener">What's new</a><button class="ib" id="updX" aria-label="Dismiss update notice" title="Later">✕</button></div>
<header class="top">
  <div class="brand">Spire</div>
  <div class="chips">
    <div><span>Tier</span><b id="hTier">1</b></div>
    <div><span>Wave</span><b id="hWave">–</b></div>
    <div><span>Cash</span><b id="hCash" class="cash">0</b></div>
    <div><span>Coins</span><b id="hCoins" class="coin">0</b></div>
    <div id="shardChip" hidden><span>Shards</span><b id="hShards" class="shard">0</b></div>
    <div id="chipChip" hidden><span>Chips</span><b id="hChips" class="chip">0</b></div>
    <div id="alloyChip" hidden><span>Alloy</span><b id="hAlloy" class="alloy">0</b></div>
  </div>
  <div class="icons">
    <button class="ib" id="histBtn" aria-label="Battle history and stats" title="Battle history and stats"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
    <button class="ib" id="helpBtn" aria-label="How to play" title="How to play">?</button>
    <button class="ib" id="setBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div class="row2">
  <button class="echip" id="eBtn" title="Enemy stats this wave" aria-label="Enemy stats this wave"><span>Enemy</span><i>♥</i><b id="eHp">–</b><i>⚔</i><b id="eAtk">–</b><i>»</i><b id="eSpd">–</b><i>⚖</i><b id="eWt">–</b></button>
  <div class="hp"><i id="hpBar"></i></div><div class="hpt" id="hpTxt">–</div>
  <div class="barw" id="barW" hidden title="Barrier: absorbs damage before health; once broken it recharges to full after a timer"><div class="hp bar" id="barTrack"><i id="barBar"></i></div><div class="hpt" id="barTxt"></div></div>
  </div>
</header>
<main class="wrap">
  <section>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="perf" id="perf" hidden></div>
      <a class="ver" id="verTag" target="_blank" rel="noopener" title="What's new"></a>
      <div class="wavebar"><i id="waveBar"></i></div>
      <div class="ov" id="ov"><div class="card" id="ovCard"></div></div>
    </div>
    <div class="ctrl">
      <button id="pause" title="Space">Pause</button>
      <div class="sp" id="speeds"></div>
      <div class="ultbar" id="ultBar"></div><div class="hackbar" id="hackBar"></div>
      <button id="tgtBtn" title="Target priority"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="lbl">Target</span></button>
      <div class="grow"></div>
      <button id="perfBtn">FPS</button>
    </div>
  </section>
  <aside class="side">
    <div class="tabs" id="tabs"></div>
    <div class="body" id="panel"></div>
  </aside>
</main>
<div class="toast" id="toast"></div>
<div class="ov modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="card wide"><div class="mhead"><h2 id="mTitle"></h2><button class="ib" id="mClose" aria-label="Close">✕</button></div><div class="mbody" id="mBody"></div></div></div>
<div class="ov wb" id="wb" hidden><div class="card"><h2>Welcome back</h2><p id="wbTxt"></p><div class="grid2"><div><span>Coins collected</span><b class="coin" id="wbCoins"></b></div><div><span>Rate</span><span id="wbRate" style="color:inherit;font-size:inherit"></span></div></div><div class="grid2" id="wbShardRow" hidden><div><span>Shards collected</span><b class="shard" id="wbShards"></b></div><div><span>Rate</span><span id="wbSRate" style="color:inherit;font-size:inherit"></span></div></div><div class="grid2" id="wbChipRow" hidden><div><span>Chips collected</span><b class="chip" id="wbChips"></b></div><div><span>Rate</span><span id="wbCRate" style="color:inherit;font-size:inherit"></span></div></div><button class="go" id="wbOk">Collect</button></div></div>
<span class="probe" id="probe"></span>
<!-- Classic scripts (not ES modules) so the game still runs from file:// with no server. Order matters. -->
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/save.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/loadout.js"></script>
<script src="js/ults.js"></script>
<script src="js/update.js"></script>
<script src="js/main.js"></script>
</body>
</html>
